[project]
name = "graetl"
version = "0.1.0"
description = "GraETL - Graphical ETL orchestration, development and runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "websockets>=12",
    # tomllib is stdlib from 3.11; graetl.config falls back to tomli below that,
    # and requires-python allows 3.10, so it has to be declared.
    "tomli>=2.0; python_version < '3.11'",
    "psycopg[binary]>=3.3.6",
    "pandas>=2.3.3",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
# Source connectors / file handling used by pipeline code.
data = [
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
]
telemetry = [
    "psutil>=5.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
graetl = "graetl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/graetl"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
